# Companies whose public job boards are collected automatically (uv run python -m app.ingest).
#
#   name: how the company is shown in the app
#   ats:  the job-board system they use: "ashby" or "greenhouse"
#   slug: the company's id on that system, taken from their careers URL
#         (jobs.ashbyhq.com/<slug>  or  job-boards.greenhouse.io/<slug>)
#
# Companies not on these systems (e.g. most Ghanaian companies) can be added by pasting
# the posting into the app instead: POST /jobs/manual

companies:
  # Top labs
  - { name: OpenAI,     ats: ashby,      slug: openai }
  - { name: Anthropic,  ats: greenhouse, slug: anthropic }

  # Strong UK / Canada / Europe hiring
  - { name: Cohere,     ats: ashby,      slug: cohere }
  - { name: ElevenLabs, ats: ashby,      slug: elevenlabs }
  - { name: Synthesia,  ats: ashby,      slug: synthesia }
  - { name: Writer,     ats: ashby,      slug: writer }

  # Developer tools (closest to the GenAI engineer roles)
  - { name: LangChain,  ats: ashby,      slug: langchain }
  - { name: Cursor,     ats: ashby,      slug: cursor }

  # Voice AI, remote-friendly
  - { name: Deepgram,   ats: ashby,      slug: deepgram }

  # Hires remotely from Africa
  - { name: Andela,     ats: ashby,      slug: andela }
