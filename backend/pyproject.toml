[project]
name = "job-match-backend"
version = "0.1.0"
description = "AI job-matching and application assistant: API and matching pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "alembic>=1.20.0",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
