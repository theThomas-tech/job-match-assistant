# Local Postgres 16 with the pgvector extension.
# Start it with:  docker compose up -d
# Stop it with:   docker compose down        (data is kept in the "pgdata" volume)
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: jobmatch
      POSTGRES_PASSWORD: jobmatch
      POSTGRES_DB: jobmatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, the first time the database is created: turns on pgvector.
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobmatch -d jobmatch"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
